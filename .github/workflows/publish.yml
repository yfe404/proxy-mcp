name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Sanity-check the exact thing users run: a git install must build via
      # the prepare script and produce the bin.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify git-install path
        run: |
          mkdir /tmp/git-install-check && cd /tmp/git-install-check
          npm init -y >/dev/null
          npm install "github:${{ github.repository }}#${{ github.ref_name }}"
          test -x node_modules/.bin/proxy-mcp
          node -e "require.resolve('proxy-mcp/dist/index.js', { paths: [process.cwd()] })"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
